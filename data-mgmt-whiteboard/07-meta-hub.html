<script src="segments.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';

/* ── Narration pacing ──────────────────────────────────────────────
   The player passes ?pace=N so reveals spread across the narration
   instead of finishing in the first few seconds. Stroke DURATIONS are
   untouched — only the gaps between beats scale, so drawing speed
   looks the same. Open this file directly (no ?pace) and it plays at
   the originally authored timing.                                     */
const PACE = (() => {
  const v = parseFloat(new URLSearchParams(location.search).get('pace'));
  return (isFinite(v) && v > 0) ? v : 1;
})();

/* ── Playback gate ─────────────────────────────────────────────────
   Two modes, both driven by the parent player.

   NARRATED (?hold=1)  reveal timers are queued and released in one go the
                       instant narration actually starts, so voice and
                       drawing begin together.

   SPEAKER (?mode=speaker)
                       nothing runs on load. Beats are bucketed into the
                       segments defined in segments.js and revealed one
                       segment at a time when the presenter advances, so a
                       live speaker sets the pace instead of racing a clock.

   Neither param → plays at the originally authored timing.                */
const WB_KEY  = '07-meta-hub';
const SPEAKER = new URLSearchParams(location.search).get('mode') === 'speaker';
const HOLD    = new URLSearchParams(location.search).get('hold') === '1';

const _segs  = (window.WB_SEGMENTS && window.WB_SEGMENTS[WB_KEY]) || [];
const _segOf = new Map();
_segs.forEach((s, i) => s.ids.forEach(id => _segOf.set(id, i)));

const _buckets = _segs.map(() => []);   // speaker mode
const _queue   = [];                    // narrated mode
let   _go      = !(HOLD || SPEAKER);
let   _segShown = -1;

function _sched(fn, ms, id) {
  if (SPEAKER) {
    const s = _segOf.has(id) ? _segOf.get(id) : 0;
    _buckets[s] ? _buckets[s].push([fn, ms]) : setTimeout(fn, ms);
    return;
  }
  _go ? setTimeout(fn, ms) : _queue.push([fn, ms]);
}

function _start() {
  if (_go) return;
  _go = true;
  _queue.forEach(([fn, ms]) => setTimeout(fn, ms));
  _queue.length = 0;
}

/* Reveal one segment, preserving the authored offsets inside it but
   starting from zero so there's no dead air after an advance. */
function _showSegment(i) {
  if (i < 0 || i >= _buckets.length) return;
  const b = _buckets[i];
  if (!b.length) { _segShown = i; _report(); return; }
  const base = Math.min(...b.map(x => x[1]));
  b.forEach(([fn, ms]) => setTimeout(fn, Math.max(0, ms - base)));
  b.length = 0;
  _segShown = i;
  _report();
}

function _nextSegment() {
  if (_segShown + 1 < _buckets.length) _showSegment(_segShown + 1);
  else _report(true);
}

/* Reveal everything remaining at once — used when leaving speaker mode. */
function _showAll() {
  for (let i = _segShown + 1; i < _buckets.length; i++) _showSegment(i);
}

function _report(atEnd) {
  try {
    parent.postMessage({
      type: 'wb:seg', key: WB_KEY,
      shown: _segShown, total: _buckets.length,
      label: (_segs[_segShown] && _segs[_segShown].label) || '',
      done: !!atEnd || _segShown >= _buckets.length - 1,
    }, '*');
  } catch (err) {}
}

window.addEventListener('message', e => {
  const d = e && e.data;
  if (d === 'wb:start')      document.fonts.ready.then(_start);
  else if (d === 'wb:next')  document.fonts.ready.then(_nextSegment);
  else if (d === 'wb:all')   document.fonts.ready.then(_showAll);
});

/* Tell the parent the gate is armed. Without this the parent can post
   'wb:start' before this listener exists and the frame stays blank. */
if (HOLD || SPEAKER) {
  try { parent.postMessage('wb:ready', '*'); } catch (err) {}
}
if (SPEAKER) document.fonts.ready.then(() => _report());

function write(id, delay, dur) {
  delay *= PACE;
  const el = document.getElementById(id);
  if (!el) return;
  try {
    const bbox = el.getBBox();
    const pad = 5;
    const clipId = 'wc-' + id;
    const defs = el.closest('svg').querySelector('defs');
    const cp = document.createElementNS(NS, 'clipPath');
    cp.id = clipId;
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', bbox.x - pad);
    r.setAttribute('y', bbox.y - pad);
    r.setAttribute('height', String(bbox.height + pad * 2));
    r.setAttribute('width', '0');
    cp.appendChild(r);
    defs.appendChild(cp);
    el.setAttribute('clip-path', `url(#${clipId})`);
    el.style.opacity = '1';
    const target = bbox.width + pad * 2;
    const durMs = dur * 1000;
    _sched(() => {
      const t0 = performance.now();
      (function tick(now) {
        const p = Math.min(1, (now - t0) / durMs);
        r.setAttribute('width', String(target * p));
        if (p < 1) requestAnimationFrame(tick);
      })(performance.now());
    }, delay * 1000, id);
  } catch(e) { fade(id, delay, dur); }
}

function draw(id, delay, dur) {
  delay *= PACE;
  const el = document.getElementById(id);
  if (!el) return;
  let len = 4000;
  try { if (el.getTotalLength) len = el.getTotalLength(); } catch(e) {}
  el.style.strokeDasharray = `${len} ${len}`;
  el.style.strokeDashoffset = String(len);
  _sched(() => {
    el.style.opacity = '1';
    requestAnimationFrame(() => {
      el.style.transition = `stroke-dashoffset ${dur}s cubic-bezier(0.35, 0, 0.25, 1)`;
      el.style.strokeDashoffset = '0';
    });
  }, delay * 1000, id);
}

function growLine(id, delay, dur, targetX2) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.opacity = '1';
    const x1 = parseFloat(el.getAttribute('x1'));
    const durMs = dur * 1000;
    const t0 = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - t0) / durMs);
      el.setAttribute('x2', String(x1 + (targetX2 - x1) * p));
      if (p < 1) requestAnimationFrame(tick);
    })(performance.now());
  }, delay * 1000, id);
}

function fade(id, delay, dur, targetOpacity = 1) {
  delay *= PACE;
  const el = document.getElementById(id);
  if (!el) return;
  _sched(() => {
    el.style.transition = `opacity ${dur}s ease`;
    el.style.opacity = String(targetOpacity);
  }, delay * 1000, id);
}

document.fonts.ready.then(() => {

  // Corner badge — sets context immediately
  fade('badge-bg',  0.2, 0.4);
  fade('badge-lbl', 0.2, 0.4);

  // Left column — problem framing
  fade('eyebrow',   0.5, 0.5);
  write('mh-title', 1.1, 0.6);

  /* Park the product icon just past the end of the title. Measured rather
     than hardcoded because the title is 54px and its rendered width depends
     on whether Poppins has loaded — we're inside fonts.ready, so it has. */
  (() => {
    const t = document.getElementById('mh-title');
    const ic = document.getElementById('mh-title-icon');
    if (!t || !ic) return;
    const b = t.getBBox();
    const size = +ic.getAttribute('width');
    ic.setAttribute('x', b.x + b.width + 20);
    ic.setAttribute('y', b.y + (b.height - size) / 2);
  })();
  fade('mh-title-icon', 1.6, 0.5);

  fade('mh-sub',    1.8, 0.5);
  growLine('div1',  2.4, 0.55, 640);

  fade('prob1', 3.0, 0.45);
  fade('prob2', 3.3, 0.45);
  fade('prob3', 3.9, 0.45);
  fade('prob4', 4.2, 0.45);
  fade('prob5', 4.8, 0.45);
  fade('prob6', 5.1, 0.45);

  fade('tkx-bg',    5.8, 0.5);
  fade('tkx-label', 6.0, 0.4);
  fade('tkx-desc',  6.2, 0.4);
  fade('tkx-desc2', 6.4, 0.4);

  fade('outcome',  6.9, 0.5);
  fade('outcome2', 7.3, 0.5);

  // Right column — established context appears early
  fade('dhub-ghost',      3.2, 0.55);
  fade('dhub-ghost-icon', 3.2, 0.55);
  fade('dhub-ghost-lbl',  3.2, 0.55);
  fade('dhub-ghost-sub',  3.4, 0.45);

  // Arrow into Meta Hub
  fade('arr-dh-mh',     7.9, 0.4);
  fade('arr-dh-mh-lbl', 8.1, 0.4);

  // Meta Hub draws in (the chapter subject)
